[project]
name = "rrxray"
version = "0.1.0"
description = "Revenue Reimagined GTM X-Ray: externally-sourced GTM diagnostic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "firecrawl-py>=1.6.0",
    "google-genai>=2.0.1",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
]

[project.scripts]
rrxray = "rrxray.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "freezegun>=1.5.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
